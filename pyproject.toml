[project]
name = "vigilia"
version = "0.1.0"
description = "A CLI tool for generating technical summaries of code changes using LLMs"
readme = "README.md"
authors = [
    { name = "Alejandro Giacometti", email = "alejandro.giacometti@beauhurst.com" },
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=1.40.0",
    "pygit2>=1.19.1",
    "rich>=14.2.0",
    "rustworkx>=0.17.1",
    "tiktoken>=0.12.0",
    "typer>=0.21.1",
]

[project.scripts]
vigilia = "vigilia:main"

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.10",
]

[tool.ruff]
target-version = "py313"
src = ["src/"]

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "COM819",
    "E",
    "F",
    "I",
    "NPY",
    "PD",
    "PT",
    "Q",
    "RUF",
    "SIM",
    "UP",
    "W",

]
ignore = ["E501"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_defs = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
follow_imports = "normal"
# plugins = ["pydantic.mypy", "numpy.typing.mypy_plugin", "dataframely.mypy"]
packages = ["vigilia"]
